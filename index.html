<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRI Link Pro - Master v79 Commander</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @media print { body * { visibility: hidden; } #print-area, #print-area * { visibility: visible; } }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .card-monitor { background: white; border: 1px solid #e2e8f0; min-width: 155px; padding: 12px; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; }
        .monitor-wrapper { display: flex; gap: 8px; overflow-x: auto; padding: 12px; background-color: #f8fafc; }
        /* MONITOR SALDO AKUN STYLE */
        .account-bar { display: flex; gap: 12px; overflow-x: auto; padding: 8px 16px; background: white; border-bottom: 1px solid #e2e8f0; }
        .account-item { white-space: nowrap; font-size: 10px; color: #1e40af; background: #eff6ff; padding: 4px 10px; border-radius: 8px; border: 1px solid #dbeafe; font-weight: 900; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .btn-locked { opacity: 0.3 !important; pointer-events: none !important; filter: grayscale(1); }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="text-gray-900 font-black uppercase tracking-tighter">

<div id="app" v-cloak>
    <div v-if="!isLoggedIn" class="min-h-screen flex items-center justify-center bg-blue-900 p-6">
        <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md text-center">
            <h1 class="text-2xl text-blue-800 mb-6 italic uppercase">BRI LINK PRO v79</h1>
            <input v-model="login.email" type="email" placeholder="EMAIL" class="w-full border p-4 rounded-xl mb-4 font-black outline-none uppercase">
            <input v-model="login.pass" type="password" placeholder="PASSWORD" class="w-full border p-4 rounded-xl mb-6 font-black outline-none">
            <button @click="handleLogin" class="w-full bg-blue-700 text-white py-4 rounded-xl font-black shadow-lg">MASUK KETUA!</button>
        </div>
    </div>

    <div v-if="isLoggedIn" class="flex flex-col lg:flex-row min-h-screen">
        <aside class="hidden lg:flex flex-col w-64 bg-blue-900 text-white h-screen sticky top-0 shadow-xl italic font-black">
            <div class="p-6 border-b border-blue-800 text-center truncate">{{ config.namaToko }}</div>
            <nav class="flex-1 p-4 space-y-1">
                <button v-for="tab in tabs" :key="tab.id" @click="activeTab = tab.id" :class="activeTab == tab.id ? 'bg-blue-700 shadow-md' : ''" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition text-sm">
                    <i :class="tab.icon"></i> {{ tab.label }}
                </button>
            </nav>
            <div class="p-4 border-t border-blue-800">
                <button @click="handleLogout" :class="sessionStarted ? 'btn-locked' : 'bg-red-600'" class="w-full py-3 rounded-xl text-[10px] text-white shadow font-black">LOGOUT</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-hidden">
            <header class="bg-white shadow-sm sticky top-0 z-50 font-black">
                <div class="monitor-wrapper no-scrollbar">
                    <div v-for="m in monitorCards" :key="m.key" class="card-monitor">
                        <p class="text-[7px] text-gray-400 uppercase leading-none mb-1">{{ m.label }}</p>
                        <p :class="m.text" class="text-xs font-black">Rp{{ formatUang(m.value) }}</p>
                    </div>
                </div>
                
                <div class="account-bar no-scrollbar font-black italic">
                    <div v-for="(v, k) in saldoAwal" :key="k" class="account-item">
                        {{ k }}: <span class="text-gray-900 ml-1">{{ formatUang(v) }}</span>
                    </div>
                </div>
            </header>

            <section class="flex-1 overflow-y-auto p-4 pb-32 no-scrollbar font-black uppercase">
                <div v-if="activeTab == 'input'">
                    <div v-if="!sessionStarted" class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-xl border-t-4 border-yellow-500 text-center font-black">
                        <h2 class="mb-4 italic">Buka Kasir</h2>
                        <div v-for="(v, k) in saldoAwal" :key="k" class="mb-2 text-left font-black">
                            <label class="text-[9px] text-gray-400 uppercase">{{k}}</label>
                            <input :value="formatUang(saldoAwal[k])" @input="updateSaldo($event, k)" class="w-full border p-2 rounded-lg text-right text-blue-900 bg-gray-50 font-black">
                        </div>
                        <button @click="startSession" class="w-full bg-blue-700 text-white py-4 rounded-xl mt-4 font-black uppercase shadow">BUKA TOKO</button>
                    </div>
                    <div v-else class="max-w-2xl mx-auto space-y-4">
                        <div class="bg-white p-5 rounded-3xl border shadow-sm space-y-4">
                            <div class="flex gap-1 p-1 bg-gray-100 rounded-xl overflow-x-auto no-scrollbar">
                                <button v-for="t in ['transfer','tarik','pulsa','tabungan','barang','wesel','paylater','migrasi','keluar']" :key="t" @click="tipe = t" :class="tipe == t ? 'bg-white shadow text-blue-700' : 'text-gray-400'" class="px-2 py-2.5 rounded-lg font-bold text-[8px] transition flex-1 uppercase">{{t}}</button>
                            </div>
                            <input v-model="form.nama" type="text" placeholder="NAMA / KETERANGAN" class="w-full border p-3 rounded-xl text-xs bg-gray-50 uppercase font-black font-black">
                            <div class="grid grid-cols-2 gap-3" v-if="tipe !== 'barang' && tipe !== 'migrasi'">
                                <div><label class="text-[9px] text-gray-400">NOMINAL</label><input :value="formatUang(form.nominal)" @input="updateForm($event, 'nominal')" class="w-full border p-3 rounded-xl font-black text-right text-blue-700 bg-white"></div>
                                <div v-if="!['tabungan','keluar'].includes(tipe)"><label class="text-[9px] text-gray-400 uppercase">Admin</label><input :value="formatUang(tipe=='pulsa'?form.modal:form.adminToko)" @input="updateForm($event, tipe=='pulsa'?'modal':'adminToko')" class="w-full border p-3 rounded-xl font-black text-right text-green-700 bg-white"></div>
                            </div>
                            <button @click="openPreview('sukses', true)" class="w-full bg-blue-700 text-white py-4 rounded-xl font-black shadow mt-2">SIMPAN TRANSAKSI</button>
                        </div>
                    </div>
                </div>

                <div v-if="activeTab == 'akun'" class="max-w-xl mx-auto space-y-6 italic font-black uppercase">
                    <div v-if="sessionStarted" class="bg-red-50 p-8 rounded-3xl border-2 border-red-200 shadow-sm space-y-4">
                        <h2 class="font-black text-red-700 border-b border-red-100 pb-4">Audit Saldo (Fix Kenyataan)</h2>
                        <div v-for="(v, k) in saldoAwal" :key="'edit-'+k" class="mb-2 font-black">
                            <label class="text-[9px] text-gray-500 uppercase">{{k}}</label>
                            <input :value="formatUang(saldoAwal[k])" @input="updateSaldo($event, k)" class="w-full border p-3 rounded-xl bg-white text-right text-red-900 font-black outline-none">
                        </div>
                        <button @click="updateCloud" class="w-full bg-red-600 text-white py-4 rounded-xl shadow uppercase">Update Sekarang</button>
                    </div>

                    <div class="bg-white p-8 rounded-3xl border shadow-sm space-y-6">
                        <h2 class="font-black border-b pb-4">Profil Agen</h2>
                        <div><label class="text-[10px] text-gray-400">NAMA TOKO</label><input v-model="config.namaToko" class="w-full border-2 p-3 rounded-xl bg-gray-50 text-sm font-black"></div>
                        <div><label class="text-[10px] text-gray-400">WhatsApp</label><input v-model="config.nomorHp" class="w-full border-2 p-3 rounded-xl bg-gray-50 text-sm font-black"></div>
                        <button @click="saveConfig" class="w-full bg-blue-700 text-white py-3 rounded-xl shadow font-black">SIMPAN</button>
                    </div>
                </div>

                <div v-if="activeTab == 'berhasil'" class="max-w-4xl mx-auto space-y-4 font-black">
                    <div v-for="(t, i) in transaksiList" :key="i" class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
                        <div class="flex-1 truncate pr-2 font-black"><span class="text-[10px] block truncate mb-1">[{{t.tipe.toUpperCase()}}] {{t.nama}}</span><span class="text-[8px] text-gray-400">{{t.tanggal}} | Rp{{formatUang(t.total)}}</span></div>
                        <div class="flex gap-2"><button @click="deleteTransaction(t)" class="bg-red-50 text-red-600 w-8 h-8 rounded-lg border font-black"><i class="fas fa-trash"></i></button></div>
                    </div>
                </div>
            </section>

            <nav class="lg:hidden fixed bottom-0 left-0 w-full bg-blue-900 flex justify-around p-2 pb-6 shadow-2xl z-50">
                <button v-for="tab in tabs" :key="tab.id" @click="activeTab = tab.id" :class="activeTab == tab.id ? 'bg-blue-700 rounded-xl' : ''" class="flex flex-col items-center gap-1 p-2 flex-1 transition font-black text-blue-200"><i :class="tab.icon + ' text-lg'"></i><span class="text-[7px] uppercase font-black">{{ tab.label }}</span></button>
            </nav>
        </main>
    </div>
</div>

<script>
// Firebase Config v79
const firebaseConfig = {
  apiKey: "AIzaSyC4MsTF08I2zXqX6IimdATSGRFl0GV3WyQ",
  authDomain: "newbrilink-ac715.firebaseapp.com",
  projectId: "newbrilink-ac715",
  databaseURL: "https://newbrilink-ac715-default-rtdb.asia-southeast1.firebasedatabase.app",
  storageBucket: "newbrilink-ac715.firebasestorage.app",
  messagingSenderId: "58744983481",
  appId: "1:58744983481:web:a48eb7837acb4ce7ec7068",
  measurementId: "G-6850ZPV20M"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

new Vue({
    el: '#app',
    data: {
        isLoggedIn: false, activeTab: 'dashboard', sessionStarted: false,
        filterRiwayat: 'semua', modeTabungan: 'setor', paymentSource: 'Laci',
        saldoAwalSesi: {}, login: { email: '', pass: '' },
        config: { namaToko: 'AGEN BAROKAH', nomorHp: '' },
        tabs: [{id:'dashboard', label:'Dash', icon: 'fas fa-chart-pie'}, {id:'input', label:'Kasir', icon: 'fas fa-cash-register'}, {id:'gudang', label:'Gudang', icon: 'fas fa-warehouse'}, {id:'piutang', label:'Utang', icon: 'fas fa-hand-holding-usd'}, {id:'berhasil', label:'Riwayat', icon: 'fas fa-history'}, {id:'laporan', label:'Report', icon: 'fas fa-chart-line'}, {id:'akun', label:'Profil', icon: 'fas fa-user-circle'}],
        saldoAwal: { BRI: 0, Mandiri: 0, Dana: 0, Digipos: 0, Pulsa: 0, Laci: 0 },
        monitor: { labaTotal: 0, profitSesi: 0, hutang: 0, tabungan: 0 },
        gudang: {}, newItem: { nama: '', stok: 0, modal: 0, jual: 0 }, selectedBarangId: null, jumlahBeli: 1,
        tipe: 'transfer', form: { nama: 'UMUM', nominal: 0, adminToko: 0, bayar: 0, rekening: 'Laci', adminMethod: 'tunai' },
        transaksiList: []
    },
    computed: {
        totalBelanjaBarang() { if(this.tipe !== 'barang' || !this.selectedBarangId) return 0; return this.gudang[this.selectedBarangId].jual * this.jumlahBeli; },
        kembalianBarang() { if(this.tipe !== 'barang') return 0; return this.form.bayar > this.totalBelanjaBarang ? this.form.bayar - this.totalBelanjaBarang : 0; },
        totalAset() { let t = 0; for(let k in this.saldoAwal) t += this.saldoAwal[k]; return t; },
        saldoSistem() {
            let total = 0; for(let k in this.saldoAwalSesi) total += this.saldoAwalSesi[k];
            this.transaksiList.forEach(t => {
                if(t.status == 'sukses') {
                    if(t.tipe == 'keluar') total -= t.total;
                    else if(t.tipe == 'tabungan') total += (t.modeTabungan == 'setor' ? t.total : -t.total);
                    else if(t.laba) total += t.laba;
                }
            });
            return total;
        },
        selisihAudit() { return this.totalAset - this.saldoSistem; },
        monitorCards() {
            return [
                { key: 'riil', label: 'KENYATAAN (RIIL)', value: this.totalAset, text: 'text-blue-900' },
                { key: 'audit', label: 'SELISIH (AUDIT)', value: this.selisihAudit, text: this.selisihAudit < 0 ? 'text-red-600' : 'text-blue-600' },
                { key: 'tab', label: 'TABUNGAN GLOBAL', value: this.monitor.tabungan, text: 'text-indigo-600' },
                { key: 'labc', label: 'LABA CLOUD', value: this.monitor.labaTotal, text: 'text-green-800' },
                { key: 'profit', label: 'PROFIT SESI', value: this.monitor.profitSesi, text: 'text-green-600' }
            ];
        }
    },
    mounted() { auth.onAuthStateChanged(u => { if(u){ this.isLoggedIn = true; this.syncAll(); } }); },
    methods: {
        formatUang(v) { return v ? v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") : 0; },
        updateSaldo(e, k) { this.saldoAwal[k] = parseInt(e.target.value.replace(/\./g, '')) || 0; },
        updateForm(e, f) { this.form[f] = parseInt(e.target.value.replace(/\./g, '')) || 0; },
        handleLogin() { auth.signInWithEmailAndPassword(this.login.email, this.login.pass).catch(() => alert("Gagal!")); },
        syncAll() {
            db.ref('permanent_history').on('value', s => { this.transaksiList = s.exists() ? s.val() : []; this.recalculateBalances(); });
            db.ref('active_session').on('value', s => { if(s.exists()){ const d=s.val(); this.saldoAwal=d.saldo; this.sessionStarted=d.started; this.saldoAwalSesi=d.saldoAwalSesi || d.saldo; } });
            db.ref('laporan').on('value', s => { let total=0; s.forEach(c => total+=(c.val().totalLaba || 0)); this.monitor.labaTotal=total; });
            db.ref('gudang').on('value', s => this.gudang = s.exists() ? s.val() : {});
            db.ref('config').on('value', s => { if(s.exists()) this.config = s.val(); });
        },
        recalculateBalances() {
            let h=0; let t=0; let l=0; let nasabah = {};
            this.transaksiList.forEach(tr => {
                if(tr.status == 'hutang') h += tr.total;
                if(tr.status == 'sukses'){
                    if(tr.tipe == 'tabungan') t += (tr.modeTabungan == 'setor' ? tr.total : -tr.total);
                    if(tr.laba) l += tr.laba;
                }
            });
            this.monitor.hutang=h; this.monitor.tabungan=t; this.monitor.profitSesi=l;
        },
        startSession() { this.sessionStarted = true; this.saldoAwalSesi = JSON.parse(JSON.stringify(this.saldoAwal)); this.updateCloud(); },
        updateCloud() { db.ref('active_session').set({ saldo: this.saldoAwal, started: this.sessionStarted, saldoAwalSesi: this.saldoAwalSesi }); },
        saveConfig() { db.ref('config').set(this.config); alert("Ok!"); },
        deleteTransaction(t) {
            if(!confirm("HAPUS?")) return;
            if(t.status == 'sukses') this.saldoAwal[t.rek || 'Laci'] -= t.total;
            const idx = this.transaksiList.findIndex(item => item.jam == t.jam);
            this.transaksiList.splice(idx, 1); db.ref('permanent_history').set(this.transaksiList); this.updateCloud();
        },
        openPreview(status, wantPrint) {
            const d = new Date(); let n, modal, adm = 0;
            if(this.tipe == 'barang') { const b = this.gudang[this.selectedBarangId]; n = b.jual * this.jumlahBeli; modal = b.modal * this.jumlahBeli; }
            else { n = parseInt(this.form.nominal) || 0; adm = parseInt(this.form.adminToko) || 0; modal = this.tipe == 'pulsa' ? parseInt(this.form.modal) || 0 : 0; }
            const profit = (this.tipe == 'barang') ? n - modal : (this.tipe == 'transfer' ? adm : (this.tipe == 'pulsa' ? n - modal : adm));
            this.printData = { jam: d.getTime(), tanggal: d.toLocaleDateString(), tipe: this.tipe, nama: this.form.nama.toUpperCase(), status, total: (this.tipe == 'wesel' ? n - adm : n + adm), laba: profit, rek: this.form.rekening, modeTabungan: this.modeTabungan, barangId: this.selectedBarangId, qty: this.jumlahBeli };
            this.saveData();
        },
        saveData() {
            const d = this.printData;
            if(d.status == 'sukses') {
                if(d.tipe == 'transfer') { this.saldoAwal[d.rek] -= d.total; this.saldoAwal.Laci += d.total; }
                else if(d.tipe == 'barang') { this.saldoAwal.Laci += d.total; if(this.gudang[d.barangId]) { this.gudang[d.barangId].stok -= d.qty; db.ref('gudang/'+d.barangId).set(this.gudang[d.barangId]); } }
                else if(d.tipe == 'tabungan') this.saldoAwal[d.rek] += (d.modeTabungan == 'setor' ? d.total : -d.total);
            }
            this.transaksiList.push({...d}); db.ref('permanent_history').set(this.transaksiList); this.updateCloud();
            this.form = { nama: 'UMUM', nominal: 0, adminToko: 0, bayar: 0, rekening: 'Laci', adminMethod: 'tunai' };
        },
        handleLogout() { auth.signOut().then(() => location.reload()); },
        resetAllDataPermanently() { if(confirm("NUKLIR?")) { db.ref().remove(); location.reload(); } }
    }
});
</script>
</body>
</html>
